<text x="629" y="1394.4" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#7946c9">사용자 한 명이 아니라 버킷 7에 속한 모든 주문을 이동한다.</text>
<text x="60" y="1482.7" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#56657c">O1~O4는 UUID를 줄여 부르는 별칭이다. 표에서는 created_at·updated_at 컬럼을 생략했다.</text>
<text x="60" y="1518.7" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#56657c">상태명·해시 결과는 설명용 예시다. 버킷마다 orders 테이블을 새로 만드는 구조가 아니다.</text>
