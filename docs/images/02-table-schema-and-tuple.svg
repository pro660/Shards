<text x="949" y="1140.85" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#17263f">user_id: 가상 주문 소유자이며 해시 입력값</text>
<text x="949" y="1177.85" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#17263f">bucket_id: 해시로 계산해 저장하는 논리적 그룹 번호</text>
<text x="949" y="1214.85" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#17263f">메타DB와 주문 DB의 일치는 애플리케이션과 검증이 관리</text>
