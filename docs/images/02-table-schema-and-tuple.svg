<text x="800" y="1410.85" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#56657c">서로 다른 DB 사이에 PostgreSQL 외래키를 만들지는 않는다.</text>
<rect x="60" y="1335" width="688" height="107" rx="18" fill="#e8eefb" stroke="#e8eefb" stroke-width="1"/>
<text x="83" y="1373.55" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="700" fill="#2563eb">실선 화살표: 메타DB 안의 FK → 참조 대상</text>
<text x="83" y="1409.15" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#56657c">PK = 행을 구분하는 기본키 · FK = 다른 행을 참조하는 외래키</text>
<text x="60" y="1503.8" font-family="Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#17263f">개수로 다시 보면</text>
