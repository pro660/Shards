spring.application.name=shards-pro
# 별도 프로필을 지정하지 않은 로컬 실행에서는 C 연결 풀도 등록합니다.
spring.profiles.default=shard-c
server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}

# 실행 디렉터리에 있는 .env에서 로컬 DB와 관리 토큰 설정을 읽습니다.
spring.config.import=optional:file:.env[.properties],optional:file:.local/sql-lab.env[.properties]

# 메타 DB가 버킷의 현재 소유자와 재배치 단계를 보관합니다.
spring.datasource.url=jdbc:postgresql://${META_DB_HOST:127.0.0.1}:${META_DB_PORT:15432}/${META_DB_NAME}?connectTimeout=3&socketTimeout=5
spring.datasource.username=${META_DB_USER}
spring.datasource.password=${META_DB_PASSWORD}

# 연결 풀의 대기 시간은 밀리초, 위 JDBC 접속·응답 시간 제한은 초 단위입니다.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

# 각 샤드의 주문은 해당 DB 전용 연결 풀로 접근합니다.
app.datasource.shard-a.jdbc-url=jdbc:postgresql://${SHARD_A_DB_HOST:127.0.0.1}:${SHARD_A_DB_PORT:15433}/${SHARD_A_DB_NAME}?connectTimeout=3&socketTimeout=5
app.datasource.shard-a.username=${SHARD_A_DB_USER}
app.datasource.shard-a.password=${SHARD_A_DB_PASSWORD}
app.datasource.shard-a.pool-name=shard-a-pool
app.datasource.shard-a.maximum-pool-size=3
app.datasource.shard-a.minimum-idle=1
app.datasource.shard-a.connection-timeout=5000

app.datasource.shard-b.jdbc-url=jdbc:postgresql://${SHARD_B_DB_HOST:127.0.0.1}:${SHARD_B_DB_PORT:15434}/${SHARD_B_DB_NAME}?connectTimeout=3&socketTimeout=5
app.datasource.shard-b.username=${SHARD_B_DB_USER}
app.datasource.shard-b.password=${SHARD_B_DB_PASSWORD}
app.datasource.shard-b.pool-name=shard-b-pool
app.datasource.shard-b.maximum-pool-size=3
app.datasource.shard-b.minimum-idle=1
app.datasource.shard-b.connection-timeout=5000
