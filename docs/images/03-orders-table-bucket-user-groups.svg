<text x="85" y="1210.65" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" fill="#17263f">orders 테이블  →  버킷 7의 주문 3건  →  사용자 1001의 주문 2건  →  주문 O1 한 행</text>
<text x="85" y="1253.25" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="400" fill="#17263f">한 버킷에는 여러 사용자의 주문이 함께 들어갈 수 있고, 한 사용자는 여러 주문을 가질 수 있습니다.</text>
<text x="60" y="1336.55" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#56657c">예시: 테이블 1개 · 데이터가 있는 버킷 2개 · 사용자 4명 · 주문 튜플 6개</text>
<text x="60" y="1374.55" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#56657c">설명용 데이터입니다. 주문번호는 UUID 별칭이며, status·created_at·updated_at 컬럼은 생략했습니다.</text>
