# Local Compose address. Override host and port for a separate machine.
app.datasource.shard-c.jdbc-url=jdbc:postgresql://${SHARD_C_DB_HOST:127.0.0.1}:${SHARD_C_DB_PORT:15435}/${SHARD_C_DB_NAME}?connectTimeout=3&socketTimeout=5
app.datasource.shard-c.username=${SHARD_C_DB_USER}
app.datasource.shard-c.password=${SHARD_C_DB_PASSWORD}
app.datasource.shard-c.pool-name=shard-c-pool
app.datasource.shard-c.maximum-pool-size=3
app.datasource.shard-c.minimum-idle=1
app.datasource.shard-c.connection-timeout=5000
